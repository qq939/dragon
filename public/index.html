<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAGON</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #0a0a0b;
    color: #c8c8c8;
    font-family: 'Georgia', 'Noto Serif SC', serif;
    line-height: 2;
    overflow: hidden;
    height: 100vh;
}

#novel-container {
    height: 100vh;
    overflow-y: auto;
    padding: 60px 80px 120px 80px;
    scroll-behavior: smooth;
}

#novel-container::-webkit-scrollbar { width: 3px; }
#novel-container::-webkit-scrollbar-track { background: transparent; }
#novel-container::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

#novel-title {
    max-width: 720px;
    margin: 0 auto 8px auto;
    text-align: center;
    color: #2a2a2a;
    font-size: 28px;
    letter-spacing: 18px;
    font-weight: normal;
    user-select: none;
}

#para-label {
    max-width: 720px;
    margin: 0 auto 48px auto;
    text-align: center;
    color: #1a1a1a;
    font-size: 11px;
    letter-spacing: 3px;
    user-select: none;
}

#novel-text {
    max-width: 720px;
    margin: 0 auto;
    white-space: pre-wrap;
    word-break: break-all;
    font-size: 16.5px;
    letter-spacing: 0.3px;
}

#novel-text:empty::before { content: ''; color: transparent; }

.para-block { margin-bottom: 1.2em; }
.para-block:last-child { margin-bottom: 0; }

#stream-cursor {
    display: inline-block;
    width: 7px;
    height: 15px;
    background: #3a3a3a;
    vertical-align: -2px;
    margin-left: 2px;
    animation: blink 0.9s infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Left side dots */
#dot-container {
    position: fixed;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 100;
}

.trigger-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #1a1a1a;
    cursor: pointer;
    transition: background 0.3s;
    position: relative;
}
.trigger-dot::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 36px;
    height: 36px;
}
.trigger-dot:hover { background: #3a3a3a; }
.trigger-dot.busy { background: #333; animation: pulse 1.5s ease-in-out infinite; }

/* Paragraph indicator */
#para-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 100;
    color: #1a1a1a;
    font-size: 12px;
    letter-spacing: 2px;
    user-select: none;
}
#para-nav:hover { color: #2a2a2a; }

/* Modal overlay */
#modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    justify-content: center;
    align-items: center;
}
#modal-overlay.active { display: flex; }

#modal {
    background: #111;
    border: 1px solid #222;
    border-radius: 4px;
    padding: 32px;
    width: 520px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
}
#modal h3 {
    color: #666;
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
}

textarea.modal-input {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #222;
    border-radius: 2px;
    color: #aaa;
    font-family: 'Georgia', serif;
    font-size: 14px;
    line-height: 1.8;
    padding: 12px;
    resize: vertical;
    outline: none;
}
textarea.modal-input:focus { border-color: #333; }
textarea.modal-input::placeholder { color: #333; }

#prompt-input { height: 100px; }
#system-prompt-input, #style-prompt-input { height: 300px; font-size: 12.5px; line-height: 1.6; }

#modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 20px;
}

#length-row {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    user-select: none;
}
#length-row.active { display: flex; }
#length-row .length-label { color: #333; font-size: 12px; letter-spacing: 2px; }
.length-opt {
    color: #444;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    padding: 4px 12px;
    border: 1px solid #1c1c1c;
    border-radius: 2px;
    transition: all 0.2s;
}
.length-opt:hover { color: #777; border-color: #2a2a2a; }
.length-opt.selected { color: #999; border-color: #333; background: #161616; }

.btn {
    padding: 8px 24px;
    border: none;
    border-radius: 2px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 1px;
}
.btn-cancel { background: transparent; color: #444; border: 1px solid #222; }
.btn-cancel:hover { color: #666; border-color: #333; }
.btn-confirm { background: #1a1a1a; color: #888; }
.btn-confirm:hover { background: #222; color: #aaa; }
.btn-confirm:disabled { opacity: 0.3; cursor: not-allowed; }

/* Version list */
#version-list { display: none; width: 100%; }
#version-list.active { display: block; }

.version-item {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid #181818;
    transition: background 0.2s;
}
.version-item:hover { background: #181818; }
.version-item:last-child { border-bottom: none; }
.version-id { color: #666; font-size: 13px; letter-spacing: 1px; min-width: 80px; }
.version-meta { color: #333; font-size: 11px; margin-left: auto; letter-spacing: 0.5px; }
#version-empty { color: #333; font-size: 12px; text-align: center; padding: 30px 0; font-style: italic; }

/* Loading indicator */
#loading {
    display: none;
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #333;
    font-size: 12px;
    letter-spacing: 3px;
    z-index: 150;
}
#loading.active { display: block; }
@keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
#loading span { animation: pulse 2s ease-in-out infinite; }

/* Toast */
#toast {
    display: none;
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #555;
    font-size: 12px;
    letter-spacing: 2px;
    z-index: 300;
}
#toast.active { display: block; animation: toastFade 2s ease forwards; }
@keyframes toastFade { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

/* Mobile */
@media (max-width: 768px) {
    #novel-container { padding: 40px 24px 100px 24px; }
    #novel-title { font-size: 22px; letter-spacing: 12px; }
}
</style>
</head>
<body>

<div id="novel-container">
    <h1 id="novel-title">DRAGON</h1>
    <div id="para-label">失业青年怒杀龙虎榜</div>
    <div id="novel-text"></div>
</div>

<div id="dot-container">
    <div class="trigger-dot" id="dot-continue" title="续写一段"></div>
    <div class="trigger-dot" id="dot-system" title="主题设定"></div>
    <div class="trigger-dot" id="dot-style" title="风格参考"></div>
    <div class="trigger-dot" id="dot-versions" title="版本"></div>
</div>

<div id="para-nav">
    <span id="para-indicator"></span>
</div>

<div id="modal-overlay">
    <div id="modal">
        <h3 id="modal-title">本段方向</h3>
        <textarea id="prompt-input" class="modal-input" placeholder="这一段想写什么…"></textarea>
        <textarea id="system-prompt-input" class="modal-input" style="display:none" placeholder="主题设定…"></textarea>
        <textarea id="style-prompt-input" class="modal-input" style="display:none" placeholder="粘贴一段你喜欢的文章，AI将模仿其风格续写…"></textarea>
        <div id="version-list"></div>
        <div id="length-row">
            <span class="length-label">字数</span>
            <span class="length-opt" data-len="300-600字">短 · 500</span>
            <span class="length-opt" data-len="800-1200字">中 · 1000</span>
            <span class="length-opt" data-len="1800-2500字">长 · 2000</span>
        </div>
        <div id="modal-buttons">
            <button class="btn btn-cancel" id="btn-cancel">取消</button>
            <button class="btn btn-confirm" id="btn-confirm">续写一段</button>
        </div>
    </div>
</div>

<div id="loading"><span>正在写…</span></div>
<div id="toast"></div>

<script>
const novelText = document.getElementById('novel-text');
const paraIndicator = document.getElementById('para-indicator');
const paraLabel = document.getElementById('para-label');
const overlay = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('modal-title');
const promptInput = document.getElementById('prompt-input');
const systemInput = document.getElementById('system-prompt-input');
const styleInput = document.getElementById('style-prompt-input');
const versionList = document.getElementById('version-list');
const btnConfirm = document.getElementById('btn-confirm');
const btnCancel = document.getElementById('btn-cancel');
const loading = document.getElementById('loading');
const toast = document.getElementById('toast');
const dotContinue = document.getElementById('dot-continue');
const container = document.getElementById('novel-container');
const lengthRow = document.getElementById('length-row');
const lengthOpts = Array.from(document.querySelectorAll('.length-opt'));

let isGenerating = false;
let totalParagraphs = 0;
let modalMode = null; // 'continue' | 'system' | 'style' | 'versions'

function getSelectedLength() {
    return localStorage.getItem('dragon_len') || '800-1200字';
}

function renderLengthOpts() {
    const cur = getSelectedLength();
    lengthOpts.forEach(o => o.classList.toggle('selected', o.dataset.len === cur));
}

lengthOpts.forEach(o => o.addEventListener('click', () => {
    localStorage.setItem('dragon_len', o.dataset.len);
    renderLengthOpts();
}));

function showToast(msg) {
    toast.textContent = msg;
    toast.classList.remove('active');
    void toast.offsetWidth;
    toast.classList.add('active');
}

function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function loadManuscript() {
    try {
        const [listResp, statusResp] = await Promise.all([
            fetch('/api/paragraphs'),
            fetch('/api/status')
        ]);
        const listData = await listResp.json();
        const paras = listData.paragraphs || [];
        totalParagraphs = paras.length;
        paraIndicator.textContent = totalParagraphs > 0 ? `共 ${totalParagraphs} 段` : '';

        if (paras.length === 0) {
            novelText.innerHTML = '';
            return;
        }
        const texts = await Promise.all(paras.map(async pa => {
            const r = await fetch('/api/paragraph/' + pa.num);
            return await r.text();
        }));
        novelText.innerHTML = texts
            .map(t => `<div class="para-block">${esc(t)}</div>`)
            .join('');
        container.scrollTop = container.scrollHeight;
    } catch (e) {
        showToast('加载失败');
    }
}

function openModal(mode) {
    modalMode = mode;
    promptInput.style.display = 'none';
    systemInput.style.display = 'none';
    styleInput.style.display = 'none';
    versionList.classList.remove('active');
    versionList.innerHTML = '';
    lengthRow.classList.remove('active');
    btnConfirm.style.display = '';
    if (mode === 'continue') {
        modalTitle.textContent = '本段方向';
        promptInput.style.display = '';
        promptInput.value = localStorage.getItem('dragon_draft') || '';
        btnConfirm.textContent = '续写一段';
        lengthRow.classList.add('active');
        renderLengthOpts();
        setTimeout(() => promptInput.focus(), 50);
    } else if (mode === 'system') {
        modalTitle.textContent = '主题设定';
        systemInput.style.display = '';
        btnConfirm.textContent = '保存';
        fetch('/api/system-prompt').then(r => r.text()).then(t => systemInput.value = t);
    } else if (mode === 'style') {
        modalTitle.textContent = '风格参考';
        styleInput.style.display = '';
        btnConfirm.textContent = '保存';
        fetch('/api/style-prompt').then(r => r.text()).then(t => styleInput.value = t);
    } else if (mode === 'versions') {
        modalTitle.textContent = '版本';
        btnConfirm.style.display = 'none';
        loadVersions();
    }
    overlay.classList.add('active');
}

function closeModal() {
    overlay.classList.remove('active');
    modalMode = null;
}

async function loadVersions() {
    versionList.classList.add('active');
    versionList.innerHTML = '<div id="version-empty">加载中…</div>';
    try {
        const r = await fetch('/api/paragraphs');
        const d = await r.json();
        const paras = d.paragraphs || [];
        if (paras.length === 0) {
            versionList.innerHTML = '<div id="version-empty">还没有段落</div>';
            return;
        }
        const rows = await Promise.all(paras.map(async pa => {
            const vr = await fetch(`/api/paragraph/${pa.num}/versions`);
            const vd = await vr.json();
            const vs = vd.versions || [];
            return `<div style="padding:8px 0;border-bottom:1px solid #181818">
                <span class="version-id">第 ${pa.num} 段</span>
                <span class="version-meta">${vs.length} 个版本 · ${pa.chars} 字</span>
            </div>`;
        }));
        versionList.innerHTML = rows.join('') || '<div id="version-empty">无版本记录</div>';
    } catch (e) {
        versionList.innerHTML = '<div id="version-empty">加载失败</div>';
    }
}

async function saveSystemOrStyle() {
    const isSystem = modalMode === 'system';
    const url = isSystem ? '/api/system-prompt' : '/api/style-prompt';
    const prompt = isSystem ? systemInput.value : styleInput.value;
    try {
        const r = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
        });
        const d = await r.json();
        if (d.success) { showToast('已保存'); closeModal(); }
        else showToast('保存失败');
    } catch (e) { showToast('请求失败'); }
}

async function continueParagraph() {
    const userPrompt = promptInput.value.trim();
    if (!userPrompt) { showToast('先写一下这段的方向'); return; }
    if (isGenerating) return;
    localStorage.removeItem('dragon_draft');
    closeModal();
    isGenerating = true;
    dotContinue.classList.add('busy');
    loading.classList.add('active');

    // 流式盒子：直接缀在正文末尾
    const streamDiv = document.createElement('div');
    streamDiv.className = 'para-block';
    streamDiv.innerHTML = '<span id="stream-cursor"></span>';
    novelText.appendChild(streamDiv);
    container.scrollTop = container.scrollHeight;

    let full = '';
    try {
        const resp = await fetch('/api/paragraph/continue-stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userPrompt, targetLength: getSelectedLength() })
        });
        if (!resp.ok) {
            const t = await resp.text();
            throw new Error(resp.status === 409 ? '已有任务在生成中' : (t || ('HTTP ' + resp.status)));
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '', doneNum = 0, finished = false;
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            let idx;
            while ((idx = buf.indexOf('\n\n')) >= 0) {
                const line = buf.slice(0, idx).trim();
                buf = buf.slice(idx + 2);
                if (!line.startsWith('data:')) continue;
                let msg;
                try { msg = JSON.parse(line.slice(5).trim()); }
                catch (e) { continue; }
                if (msg.type === 'chunk') {
                    full += msg.text;
                    streamDiv.innerHTML = esc(full) + '<span id="stream-cursor"></span>';
                    container.scrollTop = container.scrollHeight;
                } else if (msg.type === 'done') {
                    doneNum = msg.num; finished = true;
                } else if (msg.type === 'error') {
                    throw new Error(msg.error);
                }
            }
        }
        if (finished) showToast(`第 ${doneNum} 段写好了`);
        else if (!full) throw new Error('生成中断');
    } catch (e) {
        streamDiv.innerHTML = esc('生成失败：' + e.message);
        showToast('生成失败');
    } finally {
        isGenerating = false;
        dotContinue.classList.remove('busy');
        loading.classList.remove('active');
        setTimeout(loadManuscript, 800);
    }
}

dotContinue.addEventListener('click', () => { if (!isGenerating) openModal('continue'); });
document.getElementById('dot-system').addEventListener('click', () => openModal('system'));
document.getElementById('dot-style').addEventListener('click', () => openModal('style'));
document.getElementById('dot-versions').addEventListener('click', () => openModal('versions'));
btnCancel.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
btnConfirm.addEventListener('click', () => {
    if (modalMode === 'continue') continueParagraph();
    else if (modalMode === 'system' || modalMode === 'style') saveSystemOrStyle();
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && modalMode === 'continue') continueParagraph();
});
promptInput.addEventListener('input', () => {
    localStorage.setItem('dragon_draft', promptInput.value);
});

loadManuscript();
setInterval(() => { if (!isGenerating) loadManuscript(); }, 60000);
</script>
</body>
</html>
